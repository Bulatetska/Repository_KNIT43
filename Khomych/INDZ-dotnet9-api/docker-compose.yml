# Три варіанти з однаковими обмеженнями: docker compose up -d --build
name: apibench

x-limits: &limits
  mem_limit: 256m
  memswap_limit: 256m
  cpus: 1.0

services:
  controllers:
    <<: *limits
    image: bench/controllers:chiseled
    build:
      context: .
      dockerfile: docker/Dockerfile.jit
      args:
        PROJECT: Api.Controllers
    ports:
      - "8081:8080"
  minimal:
    <<: *limits
    image: bench/minimal:chiseled
    build:
      context: .
      dockerfile: docker/Dockerfile.jit
      args:
        PROJECT: Api.Minimal
    ports:
      - "8082:8080"
  aot:
    <<: *limits
    image: bench/aot:chiseled
    build:
      context: .
      dockerfile: docker/Dockerfile.aot
    ports:
      - "8083:8080"
